<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>secreT — Portal Login</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151d2e;
            --bg-card-subtle: #1e293b;
            --border-color: #334155;
            --border-highlight: #475569;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 32px 16px;
        }

        .portal-wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .portal-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
        }

        .portal-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
            padding: 5px 10px;
            border-radius: 6px;
            letter-spacing: 0.05em;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .portal-card {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--accent-cyan);
        }

        .card-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.05s ease;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background-color: #0369a1;
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        .portal-footer {
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="portal-wrapper">
        <header class="portal-header">
            <div class="portal-brand">
                <span class="brand-badge">p4dCTF</span>
                <span class="brand-title">secreT Management Portal</span>
            </div>
        </header>

        <main class="portal-card">
            <h1 class="card-title">Sign In</h1>
            <p class="card-subtitle">
                Internal administrative portal. The administrator has restricted access to confidential files. Please log in with your credentials.
            </p>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-input" id="username" name="username" type="text" placeholder="Enter username" autocomplete="username" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
                </div>

                <button class="btn-primary" type="submit" id="submit-btn">Sign In</button>
            </form>
        </main>

        <footer class="portal-footer">
            <p>&copy; 2026 P4DC CTF &middot; Web Exploitation &middot; secreT</p>
        </footer>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const username = usernameInput || 'guest';

            // Vulnerable client-side authorization:
            // Regular logons set admin to false.
            localStorage.setItem('user', username);
            localStorage.setItem('admin', 'false');
            sessionStorage.setItem('user', username);
            sessionStorage.setItem('admin', 'false');
            document.cookie = "user=" + encodeURIComponent(username) + "; path=/; SameSite=Lax";
            document.cookie = "admin=false; path=/; SameSite=Lax";

            // Redirect to dashboard.html using relative path
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
