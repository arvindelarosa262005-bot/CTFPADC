services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-P4DC Cyber Range}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-p4dc}
      DB_USERNAME: ${DB_USERNAME:-p4dc}
      DB_PASSWORD: ${DB_PASSWORD:-local-change-me}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-}
      SESSION_HTTP_ONLY: true
      SESSION_SAME_SITE: lax
      ORACLE_HOST: ${ORACLE_HOST:-}
      ORACLE_PORT: ${ORACLE_PORT:-5000}
    ports:
      - "${APP_FORWARD_PORT:-8080}:80"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-p4dc}
      POSTGRES_USER: ${DB_USERNAME:-p4dc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-change-me}
    volumes:
      - p4dc-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  p4dc-postgres:
