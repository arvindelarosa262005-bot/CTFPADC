<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    # Never build redirect URLs from the internal container port (e.g. :10000 on Render).
    UseCanonicalName Off
    UseCanonicalPhysicalPort Off

    <Directory /var/www/html/public>
        Options +FollowSymLinks -Indexes
        AllowOverride All
        Require all granted
        # public/challenges/ is a real folder (static target assets). Without this,
        # Apache redirects /challenges -> http://host:10000/challenges/ before Laravel runs.
        DirectorySlash Off
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
